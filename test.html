// Normalise pour comparer sans tenir compte de la casse NI des accents :
// decompose (NFD) puis retire les diacritiques combinatoires, et passe en majuscules.
// Repli si String.normalize n'existe pas (tres vieux moteurs) : simple toUpperCase.
function _fold(str) {
	if (str.normalize) str = str.normalize('NFD').replace(/[̀-ͯ]/g, '');
	return str.toUpperCase();
}

var _clientsCache = null;   // noms d'origine (affichage)
var _foldedCache = null;    // versions repliees (recherche), meme index

function _clients() {
	if (_clientsCache) return _clientsCache;
	var recs = CLIENTS_BLOB.split('\n');
	var out = new Array(recs.length);
	var folded = new Array(recs.length);
	var prev = '';
	for (var i = 0; i < recs.length; i++) {
		var rec = recs[i];
		var n = rec.charCodeAt(0) - 32;      // longueur du prefixe partage
		var s = prev.slice(0, n) + rec.slice(1);
		out[i] = s;
		folded[i] = _fold(s);
		prev = s;
	}
	_clientsCache = out;
	_foldedCache = folded;
	return out;
}

// Equivalent de l'appel API. Renvoie [] si name < 3 caracteres.
// "contains" insensible a la casse ET aux accents.
function GetClients(name) {
	if (name == null) return [];
	var q = String(name).trim();
	if (q.length < 3) return [];
	q = _fold(q);
	var all = _clients();
	var folded = _foldedCache;
	var res = [];
	for (var i = 0; i < all.length; i++) {
		if (folded[i].indexOf(q) !== -1) res.push({ Name: all[i] });
	}
	return res;
}

// Optionnel : si tu veux garder la structure fetch(...).then(...) inchangee,
// cette version renvoie une Promesse resolue avec le meme tableau.
function GetClientsAsync(name) {
	return Promise.resolve(GetClients(name));
}

						res.style.display = 'block';

					return true;
				}
				/*).catch(function (err) {
					document.getElementById("loading").style.display = 'none';
					console.warn('Something went wrong.', err);
					return false;
				}*/
				);
	}
	
	function afterLoad() {
		let dbg = '' ;
		if (window.AdaptavistBridge) {
			LoadFieldClients();
		} else {
			dbg = dbg + 'window.AdaptavistBridge non def' + '<br/>' ;
		}

		if (!window.AdaptavistBridgeContext) {
			dbg = dbg + 'window.AdaptavistBridgeContext non def' + '<br/>' ;
		}
		updateDbg(dbg) ;
		// StrClientsToArrayClients();
		// DispArrayClients();
	} ;
	
	function LoadFieldClients() {
		window.AdaptavistBridge.request({
			url: `/rest/api/2/issue/${window.AdaptavistBridgeContext.context.issueKey}`,
			type: 'GET'
		})
		.then(d => {
			issue = d;
			StrClients = d.fields.customfield_10124 ;
			if (StrClients===null) StrClients = '' ;
			StrClientsToArrayClients();
			DispArrayClients();
		},
		derr => {
			console.log(derr) ;
		}
		);
	}
	function SaveFieldClients() {
		if (!window.AdaptavistBridge) 
			return ;
		
		ArrayClientsToStrClients() ;
		issue.fields.customfield_10124 = StrClients;
		// { update: { customfield_10124 : [ { "set" : StrClients} ] }

		window.AdaptavistBridge.request({
			url: `/rest/api/2/issue/${window.AdaptavistBridgeContext.context.issueKey}`,
			type: 'PUT',
			data: JSON.stringify(   { update: { customfield_10124 : [ { "set" : StrClients} ] } }    ),
		})
		.then(d => {
			console.log('sauvé');
		});
	}
	
	function StrClientsToArrayClients() {
		ArrayClients = StrClients.split(';').filter(s => s!==null && s!==undefined && s!=='').map(s=>s.trim()).filter(s => s!=='');
	}
	function ArrayClientsToStrClients() {
		StrClients = ArrayClients.join(';');
	}
	function DispArrayClients() {
		let res = document.getElementById("containerclients");
		let ih = '' ;
	
		for (var i = 0; i < ArrayClients.length; i++) {
			var nomcli = ArrayClients[i];
			let template = '<div id="cli_'+i+'" class="spd">'+nomcli+' <span class="spbx" onclick="ClicDeleteCli('+i+')">X</span></div>' ;
			ih = ih+template ;
		}
		res.innerHTML = ih;
	}
	function ClicDeleteCli(idxCli) {
		ArrayClients.splice(idxCli, 1) ;
		SaveFieldClients();
		DispArrayClients();
	}
	function ShowHideControls() {
		if (editMode) {
			document.getElementById("containerclients").style.visibility = 'collapse';
			document.getElementById("btnshowajoutercli").style.visibility = 'collapse';

			document.getElementById("formclient").style.display = 'block';
			document.getElementById("btncloseajoutercli").style.visibility = 'visible';
		} else {
			document.getElementById("containerclients").style.visibility = 'visible';
			document.getElementById("btnshowajoutercli").style.visibility = 'visible';

			document.getElementById("formclient").style.display = 'none';
			document.getElementById("btncloseajoutercli").style.visibility = 'collapse';
		}
		if (lastsearchres == undefined) {
			document.getElementById("result").style.display = 'none';
		}
		// let editMode = false ;
		// let changesOccured = false ;
	}
	function ClicShowAjouterCli() {
		document.getElementById("q").focus();
		editMode = true ;
		ShowHideControls();
	}
	function ClicHideAjouterCli() {
		document.getElementById("result").innerHTML = '';
		document.getElementById("q").value = '';
		lastsearchres = undefined;
		editMode = false ;
		ShowHideControls();
	}
	function ClicCloseAjouterCli() {
		ClicHideAjouterCli();
	}

	function ClicAddCli(idxCli) {
		ArrayClients.push(lastsearchres[idxCli].Name);
		SaveFieldClients();
		DispArrayClients();
		ClicHideAjouterCli();
	}

	function waitForContext(timeout = 10000, interval = 100) {
	  return new Promise((resolve, reject) => {
		const start = Date.now();
		(function check() {
		  const ctx = window.AdaptavistBridgeContext && window.AdaptavistBridgeContext.context;
		  if (ctx && ctx.issueKey) {
			resolve(ctx);
		  } else if (Date.now() - start > timeout) {
			reject(new Error('Contexte Adaptavist indisponible (timeout)'));
		  } else {
			setTimeout(check, interval);
		  }
		})();
	  });
	}

	waitForContext()
	  .then(ctx => {
		console.log('issueKey =', ctx.issueKey);
		afterLoad();
	  })
	  .then(d => console.log('data', d))
	  .catch(err => console.error(err));
	
	
	/*window.onload = afterLoad();*/
	


</script>
